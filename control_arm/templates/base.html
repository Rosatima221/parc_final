<html lang="{{ lang }}" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Parc Robotics{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

    <style>
        /* ── PRL Design System ─────────────────────────────────────────────── */
        :root {
            /* Inherited from theme.css, here we only keep overrides or base-specific layout shortcuts */
            --nav-w:      var(--sidebar-collapsed);
            --hdr-h:      var(--header-height);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
        }

        body { font-family: var(--sans); background: var(--bg); }

        /* ── Scrollbar ─────────────────────────────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

        /* ── Header ────────────────────────────────────────────────────────── */
        .parc-hdr {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--hdr-h);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 16px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            z-index: 200;
            gap: 16px;
        }

        .parc-logo {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 600;
            color: var(--amber);
            letter-spacing: 0.05em;
            padding: 0;
            line-height: 1;
            user-select: none;
            width: fit-content;
        }

        .parc-conn {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .parc-dot {
            position: relative;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--bg4);
            flex-shrink: 0;
            transition: background 0.4s;
        }

        .parc-dot::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: var(--green);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .parc-dot.live { background: var(--green); }
        .parc-dot.live::after {
            opacity: 0.2;
            animation: parc-ring 2.4s ease-in-out infinite;
        }

        @keyframes parc-ring {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            60%       { transform: scale(2.2); opacity: 0; }
        }

        #parc-label { color: var(--text-secondary); }

        #parc-port {
            font-family: var(--mono);
            font-size: 11px;
            padding: 2px 7px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text-dim);
            transition: color 0.3s, border-color 0.3s;
        }

        #parc-port.live { color: var(--green); border-color: rgba(16,185,129,0.25); }

        .parc-hdr-right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
        }

        .parc-ibtn {
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 5px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 600;
            padding: 0;
        }

        .parc-ibtn:hover {
            background: var(--glass-hover);
            border-color: var(--border2);
            color: var(--text);
            transform: translateY(-1px);
        }

        .parc-ibtn svg {
            width: 16px; height: 16px;
            stroke: currentColor; fill: none;
            stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .parc-ibtn.spinning svg { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .parc-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }

        /* ── Sidebar Nav ───────────────────────────────────────────────────── */
        .parc-nav {
            position: fixed;
            left: 0; top: var(--hdr-h); bottom: 0;
            width: var(--sidebar-collapsed);
            background: var(--bg2);
            border-right: 1px solid var(--border);
            z-index: 150;
            overflow: hidden;
            transition: width 0.22s cubic-bezier(0.16,1,0.3,1);
            display: flex;
            flex-direction: column;
        }

        .parc-nav:hover, .parc-nav:focus-within { 
            width: var(--sidebar-width, 260px);
            background: var(--bg2);
            box-shadow: 10px 0 30px rgba(0,0,0,0.3);
        }

        .parc-nav ul { list-style: none; padding: 12px 0; flex: 1; }

        .parc-nlink {
            display: flex;
            align-items: center;
            height: 48px;
            text-decoration: none;
            color: var(--text-secondary);
            font-family: var(--sans);
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            border-left: 3px solid transparent;
            transition: all 0.2s var(--ease-out);
            cursor: pointer;
            background: none;
            width: 100%;
            border-top: none; border-right: none; border-bottom: none;
            padding: 0;
            margin-bottom: 2px;
        }

        .parc-nlink:hover { 
            background: var(--glass-hover); 
            color: var(--text); 
            padding-left: 2px;
        }

        .parc-nlink.active {
            color: var(--blue);
            border-left-color: var(--blue);
            background: var(--blue-dim);
            font-weight: 600;
            box-shadow: inset 5px 0 10px -5px var(--blue-glow);
        }

        .parc-nlink.active .parc-nico svg { 
            stroke: var(--blue);
            filter: drop-shadow(0 0 5px var(--blue-glow));
        }

        .parc-nico {
            width: var(--sidebar-collapsed, 68px);
            height: 48px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .parc-nico svg {
            width: 17px; height: 17px;
            stroke: currentColor; fill: none;
            stroke-width: 1.75;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .parc-nlabel {
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.16s 0.04s, transform 0.16s 0.04s;
            flex: 1;
            overflow: hidden;
        }

        .parc-nav:hover .parc-nlabel,
        .parc-nav:focus-within .parc-nlabel {
            opacity: 1;
            transform: translateX(0);
        }

        .parc-nkbd {
            font-family: var(--mono);
            font-size: 9px;
            color: var(--text-muted);
            background: var(--bg4);
            border: 1px solid var(--border);
            padding: 1px 5px;
            border-radius: 3px;
            margin-right: 12px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.16s 0.04s;
        }

        .parc-nav:hover .parc-nkbd,
        .parc-nav:focus-within .parc-nkbd { opacity: 1; }

        .parc-nbadge {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--bg4);
            margin-left: 6px;
            vertical-align: middle;
            flex-shrink: 0;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .parc-nbadge.live {
            background: var(--green);
            box-shadow: 0 0 5px rgba(16,185,129,0.6);
        }

        /* ── Shell ─────────────────────────────────────────────────────────── */
        .parc-shell {
            padding-top: var(--hdr-h);
            padding-left: var(--nav-w);
            min-height: 100vh;
        }

        /* ── Toasts ────────────────────────────────────────────────────────── */
        #parc-toasts {
            position: fixed;
            bottom: 20px; right: 20px;
            z-index: 9999;
            display: flex; flex-direction: column; gap: 8px;
            pointer-events: none;
        }

        .parc-toast {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text);
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-left: 3px solid var(--border2);
            padding: 9px 14px;
            border-radius: 3px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.7);
            animation: parc-tin 0.18s ease;
            max-width: 300px;
        }

        .parc-toast.ok   { border-left-color: var(--green); }
        .parc-toast.err  { border-left-color: var(--red); }
        .parc-toast.info { border-left-color: var(--amber); }

        @keyframes parc-tin {
            from { transform: translateY(6px); opacity: 0; }
            to   { transform: translateY(0);   opacity: 1; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <a href="/" class="skip-link">Skip to content</a>

    <!-- ── Header ──────────────────────────────────────────────────────────── -->
    <header class="parc-hdr" role="banner">
        <a href="/" class="parc-logo" aria-label="Parc Robotics Home">
            <img src="/static/img/parc-logo.png" alt="Parc Robotics Logo" style="height: 32px; transition: all 0.3s var(--ease-out);">
        </a>

        <div class="parc-conn" role="status" aria-live="polite" aria-atomic="true">
            <span class="parc-dot" id="parc-dot" aria-hidden="true"></span>
            <span id="parc-label">Parc Robotics</span>
            <span id="parc-port" aria-label="Serial port">no device</span>
        </div>

        <div class="parc-hdr-right">
            <a href="/settings" class="parc-ibtn"
               aria-label="{{ t('nav.settings') }}"
               title="{{ t('nav.settings') }} (S)">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </a>
            <div class="parc-sep" aria-hidden="true"></div>
            <button class="parc-ibtn"
                    onclick="prlToggleLang()"
                    id="parc-lang-btn"
                    aria-label="Switch language"
                    style="width:auto;padding:0 12px;letter-spacing:0.05em;font-size:11px;background:var(--bg3);border-color:var(--border);">
                {{ lang|upper }}
            </button>
        </div>
    </header>

    <!-- ── Sidebar nav ─────────────────────────────────────────────────────── -->
    {% set _path = request.path %}
    <nav class="parc-nav" aria-label="Main navigation">
        <ul role="list">
            <li>
                <a href="/" class="parc-nlink {% if _path == '/' %}active{% endif %}"
                   aria-label="{{ t('nav.dashboard') }}" aria-current="{{ 'page' if _path == '/' else 'false' }}">
                    <span class="parc-nico" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                    </span>
                    <span class="parc-nlabel">{{ t('nav.dashboard') }}</span>
                    <span class="parc-nkbd" aria-hidden="true">H</span>
                </a>
            </li>
            <li>
                <a href="/learn" class="parc-nlink {% if _path == '/learn' %}active{% endif %}"
                   aria-label="{{ t('nav.learn') }}" aria-current="{{ 'page' if _path == '/learn' else 'false' }}">
                    <span class="parc-nico" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    </span>
                    <span class="parc-nlabel">{{ t('nav.learn') }}</span>
                    <span class="parc-nkbd" aria-hidden="true">L</span>
                </a>
            </li>

            <li>
                <a href="/play" class="parc-nlink {% if _path == '/play' %}active{% endif %}"
                   aria-label="{{ t('nav.play') }}" aria-current="{{ 'page' if _path == '/play' else 'false' }}">
                    <span class="parc-nico" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01M17 12h.01"/><path d="M5 10v4M7 12H3"/></svg>
                    </span>
                    <span class="parc-nlabel">{{ t('nav.play') }}</span>
                    <span class="parc-nkbd" aria-hidden="true">X</span>
                </a>
            </li>
            <li>
                <button class="parc-nlink" id="parc-nav-mujoco"
                        onclick="prlLaunchViewer(event)"
                        aria-label="{{ t('nav.mujoco') }}">
                    <span class="parc-nico" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                    </span>
                    <span class="parc-nlabel">{{ t('nav.mujoco') }} <span class="parc-nbadge" id="parc-vdot"></span></span>
                    <span class="parc-nkbd" aria-hidden="true">M</span>
                </button>
            </li>
        </ul>
    </nav>

    <!-- ── Page content ────────────────────────────────────────────────────── -->
    <div class="parc-shell">
        {% block content %}{% endblock %}
    </div>

    <div id="parc-toasts" role="status" aria-live="polite" aria-atomic="false"></div>

    <script>
        /* ── i18n ──────────────────────────────────────────────────────────── */
        const _prl_en = {{ en_json|tojson }};
        const _prl_fr = {{ fr_json|tojson }};
        let   _prl_lang = '{{ lang }}';
        window.t = function(k) {
            const d = _prl_lang === 'fr' ? _prl_fr : _prl_en;
            return k.split('.').reduce((o,k) => (o||{})[k], d) || k;
        };
        window.setLang = function(l) {
            document.cookie = `lang=${l};path=/;max-age=${60*60*24*365}`;
            window.location.reload();
        };
        window.prlToggleLang = function() {
            setLang(_prl_lang === 'en' ? 'fr' : 'en');
        }


        /* ── Toast ─────────────────────────────────────────────────────────── */
        const PARC = {
            toast(msg, type='info', ms=3500) {
                const el = document.createElement('div');
                el.className = `parc-toast ${type}`;
                el.textContent = msg;
                document.getElementById('parc-toasts').appendChild(el);
                setTimeout(() => el.remove(), ms);
            }
        };
        window.PARC = PARC;

        /* ── Robot status ──────────────────────────────────────────────────── */
        const _dot   = document.getElementById('parc-dot');
        const _port  = document.getElementById('parc-port');

        window.parcSetConnected = function(port) {
            _dot.classList.add('live');
            _port.classList.add('live');
            _port.textContent = port || 'connected';
        };

        (async () => {
            try {
                const d = await (await fetch('/api/status')).json();
                if (d.connected) parcSetConnected(d.settings?.port);
            } catch {}
        })();

        /* ── Discover ──────────────────────────────────────────────────────── */
        window.parcDiscover = async function() {
            const btn = document.getElementById('parc-disc-btn');
            btn.classList.add('spinning');
            btn.disabled = true;
            PARC.toast('Scanning for Parc Robotics…', 'info');
            try {
                const { ports = [] } = await (await fetch('/api/ports')).json();
                if (!ports.length) { PARC.toast('No robot ports found', 'err'); }
                else {
                    let ok = false;
                    for (const port of ports) {
                        try {
                            const d = await (await fetch('/api/connect', {
                                method: 'POST',
                                headers: {'Content-Type':'application/json'},
                                body: JSON.stringify({port, baudrate:1000000})
                            })).json();
                            if (d.ok) { parcSetConnected(port); PARC.toast('Connected — '+port, 'ok'); ok=true; break; }
                        } catch { continue; }
                    }
                    if (!ok) PARC.toast('Ports found, connection failed', 'err');
                }
            } catch(e) { PARC.toast('Error: '+e.message, 'err'); }
            btn.classList.remove('spinning');
            btn.disabled = false;
        };

        /* ── MuJoCo viewer ─────────────────────────────────────────────────── */
        const _vdot = document.getElementById('parc-vdot');
        let _vrun = false;

        async function prlCheckViewer() {
            try {
                const { running } = await (await fetch('/api/viewer/status')).json();
                _vrun = running;
                _vdot.classList.toggle('live', running);
            } catch {}
        }

        window.prlLaunchViewer = async function(e) {
            e.preventDefault();
            if (_vrun) { PRL.toast('Viewer already running', 'info'); return; }
            PRL.toast('Launching MuJoCo viewer…', 'info');
            try {
                const { ok, error } = await (await fetch('/api/viewer/start', {method:'POST'})).json();
                if (ok) { _vrun = true; _vdot.classList.add('live'); PRL.toast('Viewer launched', 'ok'); }
                else PRL.toast('Failed: '+(error||'unknown'), 'err');
            } catch(e) { PRL.toast('Error: '+e, 'err'); }
        };

        prlCheckViewer();
        setInterval(prlCheckViewer, 5000);

        /* ── Keyboard shortcuts ────────────────────────────────────────────── */
        document.addEventListener('keydown', ev => {
            if (ev.target.matches('input,textarea,select,[contenteditable]')) return;
            if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
            const map = { h:'/', l:'/learn', x:'/play', s:'/settings' };
            const dest = map[ev.key.toLowerCase()];
            if (dest && dest !== window.location.pathname) { window.location.href = dest; return; }
            if (ev.key.toLowerCase() === 'm') prlLaunchViewer(ev);
            if (ev.key.toLowerCase() === 'd') prlDiscover();
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
